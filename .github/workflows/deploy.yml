name: Linux-AI Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target"
        required: true
        default: "coolify"
        type: choice
        options:
          - coolify
          - vercel
          - all

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --- Run tests first ---
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psutil PyYAML numpy scikit-learn pandas
          pip install -e .

      - name: Run tests
        run: pytest tests/python/ -v --tb=short

  # --- Deploy to Coolify (self-hosted) ---
  deploy-coolify:
    needs: test
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.deploy_target == 'coolify' ||
        github.event.inputs.deploy_target == 'all'))

    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_BASE: ${{ secrets.COOLIFY_API_BASE }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::warning::Coolify secrets not configured. Skipping deploy."
            exit 0
          fi

          API_BASE="${COOLIFY_API_BASE:-http://localhost:8000/api/v1}"

          echo "Triggering Coolify deployment..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${API_BASE}/applications/${COOLIFY_APP_UUID}/restart" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Coolify deploy triggered successfully (HTTP $HTTP_CODE)"
            echo "$BODY" | head -c 500
          else
            echo "::error::Coolify deploy failed (HTTP $HTTP_CODE)"
            echo "$BODY" | head -c 500
            exit 1
          fi

      - name: Verify deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_API_BASE: ${{ secrets.COOLIFY_API_BASE }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_APP_UUID" ]; then
            exit 0
          fi
          API_BASE="${COOLIFY_API_BASE:-http://localhost:8000/api/v1}"

          echo "Waiting 30s for deployment..."
          sleep 30

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Accept: application/json" \
            "${API_BASE}/applications/${COOLIFY_APP_UUID}")

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")

          echo "Application status: $STATUS"
          if [ "$STATUS" = "running" ]; then
            echo "Deployment verified successfully!"
          else
            echo "::warning::Application status is '$STATUS' - may still be deploying"
          fi

  # --- Deploy to Vercel (web projects) ---
  deploy-vercel:
    needs: test
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.deploy_target == 'vercel' ||
       github.event.inputs.deploy_target == 'all')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not configured. Skipping deploy."
            exit 0
          fi

          npm i -g vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # --- Notify on completion ---
  notify:
    needs: [deploy-coolify, deploy-vercel]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send deployment notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Pass untrusted commit message via env (NOT shell interpolation) to prevent
          # script injection: a commit message like $(curl evil) must stay literal data.
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1)
          STATUS="${{ needs.deploy-coolify.result }}"

          MSG="[Linux-AI Deploy] ${STATUS}
          Branch: ${{ github.ref_name }}
          Commit: ${COMMIT_MSG}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Telegram
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MSG}\"}" > /dev/null
          fi

          # Discord
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"${MSG}\"}" > /dev/null
          fi

          echo "Notification sent."
