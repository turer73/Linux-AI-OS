# =============================================================================
# Linux-AI OS - Ubuntu Preseed Configuration
# =============================================================================
# Otomatik Ubuntu 22.04 kurulumu için preseed dosyası.
# Bu dosya ISO içine gömülür, kurulumda soru sormadan ilerler.
# =============================================================================

# --- Locale & Keyboard ---
d-i debian-installer/locale string tr_TR.UTF-8
d-i keyboard-configuration/layoutcode string tr
d-i keyboard-configuration/variantcode string
d-i console-setup/ask_detect boolean false

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string linux-ai
d-i netcfg/get_domain string local

# --- Mirror ---
d-i mirror/country string manual
d-i mirror/http/hostname string archive.ubuntu.com
d-i mirror/http/directory string /ubuntu
d-i mirror/http/proxy string

# --- Clock & Timezone ---
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Istanbul
d-i clock-setup/ntp boolean true

# --- Disk Partitioning ---
# Tüm diski kullan, LVM ile
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic

# Onay olmadan bölümle
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- User Account ---
d-i passwd/user-fullname string Linux-AI Admin
d-i passwd/username string aiadmin
# Varsayılan şifre: linux-ai (kullanıcı sonra değiştirir)
d-i passwd/user-password-crypted string $6$rounds=4096$randomsalt$V8VHj7.YdKzIqJm3R8eO7lR5mQjN3EWx9GqJ0ePfYqVz5K4YkF1xXxSbZ0wR3jN5eI8hT9fA2mX6vB4qW1nP0
d-i user-setup/allow-password-empty boolean false
d-i user-setup/encrypt-home boolean false

# --- Base System ---
d-i base-installer/kernel/image string linux-generic
tasksel tasksel/first multiselect ubuntu-server-minimal

# --- Package Selection ---
# Minimal + bizim ihtiyaçlarımız
d-i pkgsel/include string \
    openssh-server \
    curl wget git \
    build-essential gcc g++ make cmake \
    python3 python3-pip python3-venv python3-dev \
    libssl-dev libffi-dev \
    lm-sensors htop \
    cron \
    xfce4 xfce4-goodies xfce4-terminal \
    lightdm lightdm-gtk-greeter \
    firefox \
    network-manager \
    thunar \
    xfce4-power-manager \
    pulseaudio pavucontrol

d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# --- Grub ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- Post-Install ---
# Kurulum sonrası Linux-AI setup scriptini çalıştır
d-i preseed/late_command string \
    in-target bash -c 'mkdir -p /opt/linux-ai-setup'; \
    cp /cdrom/linux-ai/post-install.sh /target/opt/linux-ai-setup/post-install.sh; \
    cp /cdrom/linux-ai/desktop-setup.sh /target/opt/linux-ai-setup/desktop-setup.sh; \
    in-target chmod +x /opt/linux-ai-setup/post-install.sh; \
    in-target chmod +x /opt/linux-ai-setup/desktop-setup.sh; \
    in-target bash -c 'echo "@reboot root /opt/linux-ai-setup/post-install.sh" >> /etc/crontab'

# --- Finish ---
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean false
